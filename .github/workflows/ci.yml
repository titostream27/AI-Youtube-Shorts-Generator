name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Renderer contract fixtures live in the MINER repo. Brief v7 C13:
      # PIN the miner contract revision (never unpinned main). Updated from
      # 5c1c238 -> 84c5e3e (brief v10/v11 closure HEAD: added
      # render-result-v2-failed / render-result-v2-partial parity fixtures
      # and manifest entries; renderer supports the canonical failed/partial
      # vocabulary since v10 C12).
      - uses: actions/checkout@v4
        with:
          path: AI-Youtube-Shorts-Generator

      - name: Checkout miner (pinned contract revision)
        uses: actions/checkout@v4
        with:
          repository: titostream27/youtube-content-miner
          ref: 84c5e3e
          path: content-miner

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production requirements FAIL-FAST (brief v5 9.1)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Brief v7 C13: discovery-based CI — pytest auto-collects every
      # test_*.py instead of a hand-maintained list that silently misses
      # new suites (test_hardening_v7, test_state_v7, test_visual_v7,
      # test_ops_v7, ...).
      - name: Run all discovered tests
        working-directory: AI-Youtube-Shorts-Generator
        run: python -m pytest -q

      - name: Shared contract fixtures must be present (fail, not skip)
        working-directory: AI-Youtube-Shorts-Generator
        run: |
          test -f ../content-miner/contracts/fixtures/manifest.json
          test -f ../content-miner/contracts/render-result-v2.schema.json

      - name: Publish test summary
        if: always()
        working-directory: AI-Youtube-Shorts-Generator
        run: |
          echo "## Test results" >> $GITHUB_STEP_SUMMARY
          echo "- pytest: discovery-based (all test_*.py suites)" >> $GITHUB_STEP_SUMMARY
