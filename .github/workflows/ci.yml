name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Renderer contract fixtures live in the MINER repo. Brief v7 C13:
      # PIN the miner contract revision (never unpinned main). Updated from
      # 5c1c238 -> 84c5e3e (brief v10/v11 closure HEAD: added
      # render-result-v2-failed / render-result-v2-partial parity fixtures
      # and manifest entries; renderer supports the canonical failed/partial
      # vocabulary since v10 C12).
      - uses: actions/checkout@v4
        with:
          path: AI-Youtube-Shorts-Generator

      - name: Checkout miner (pinned contract revision)
        uses: actions/checkout@v4
        with:
          repository: titostream27/youtube-content-miner
          # V12 (RV12-F09/G1): pin the FULL SHA. The miner history was
          # force-pushed on 2026-08-10 and the short ref 84c5e3e became
          # unresolvable; the commit is restored as the tag
          # refs/tags/renderer-pinned-contracts-v11 so this checkout works.
          ref: 84c5e3e80a3381ce0e85bc8e6f9a09c3f4353047
          path: content-miner

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test requirements FAIL-FAST (brief v5 9.1 / V12R-F03)
        working-directory: AI-Youtube-Shorts-Generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      # V12R-F03: media binaries MUST be present before pytest. A missing
      # binary fails setup — visual suites never skip.
      - name: Verify ffmpeg/ffprobe (fail setup, not skip)
        working-directory: AI-Youtube-Shorts-Generator
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # V12R-F03: deterministic visual fixtures generated before pytest
      # (both the legacy suite and the V12R scenario suite).
      - name: Generate deterministic visual fixtures
        working-directory: AI-Youtube-Shorts-Generator
        run: |
          python scripts/make_visual_fixtures.py fixtures/visual
          python scripts/gen_visual_fixtures.py

      # Brief v7 C13: discovery-based CI — pytest auto-collects every
      # test_*.py instead of a hand-maintained list that silently misses
      # new suites (test_hardening_v7, test_state_v7, test_visual_v7,
      # test_ops_v7, ...).
      - name: Run all discovered tests (JUnit + skip report)
        working-directory: AI-Youtube-Shorts-Generator
        run: |
          mkdir -p evidence/v12r/tests
          set -o pipefail
          python -m pytest -q --junitxml=evidence/v12r/tests/pytest-junit.xml -rs --tb=short 2>&1 | tee evidence/v12r/tests/pytest-run.log
          tail -5 evidence/v12r/tests/pytest-run.log
          python - <<'EOF'
          import xml.etree.ElementTree as ET, json, os
          p = "evidence/v12r/tests/pytest-junit.xml"
          t = ET.parse(p).getroot()
          tot = {k: int(t.attrib.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          skipped = [tc.attrib.get("name") for ts in t.iter("testsuite") for tc in ts.iter("testcase") if tc.find("skipped") is not None]
          with open("evidence/v12r/tests/pytest-summary.json", "w") as f:
              json.dump({"totals": tot, "skipped": skipped}, f, indent=2)
          with open("evidence/v12r/tests/skip-report.txt", "w") as f:
              f.write("\n".join(skipped) or "(no skips)")
          EOF
          SKIPS=$(python -c "import json;print(json.load(open('evidence/v12r/tests/pytest-summary.json'))['totals']['skipped'])")
          echo "blocking skips: ${SKIPS}"
          test "${SKIPS}" -eq 0

      - name: Shared contract fixtures must be present (fail, not skip)
        working-directory: AI-Youtube-Shorts-Generator
        run: |
          test -f ../content-miner/contracts/fixtures/manifest.json
          test -f ../content-miner/contracts/render-result-v2.schema.json

      - name: Publish test summary
        if: always()
        working-directory: AI-Youtube-Shorts-Generator
        run: |
          echo "## Test results" >> $GITHUB_STEP_SUMMARY
          echo "- pytest: discovery-based (all test_*.py suites)" >> $GITHUB_STEP_SUMMARY
